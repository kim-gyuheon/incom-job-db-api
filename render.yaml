services:
  - type: web
    name: job-db-api
    runtime: python
    plan: free
    rootDir: api
    # master에 푸시하면 자동 재배포
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    # Render가 주입하는 $PORT로 바인딩해야 한다 (고정 포트 사용 시 배포 실패)
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # 아래 값들은 저장소에 두지 않고 Render 대시보드에서 직접 입력한다.
      # STT_PROVIDER    : 음성 -> 텍스트 공급자. openai | mock
      #                   openai = OPENAI_API_KEY로 Whisper API 호출(요청당 과금). 2026-08-26:
      #                     원래는 과금을 피하려고 faster-whisper를 같은 프로세스에서 직접
      #                     돌리는 local 경로가 기본이었는데, Render 무료 플랜 메모리 한도와
      #                     실사용 인식 품질 사이에서 계속 트레이드오프에 시달려서 openai로
      #                     완전히 전환하기로 결정 — local 경로/faster-whisper 의존성 자체를
      #                     코드에서 제거했다(api/stt.py 참고).
      #                   mock = 고정 문장 반환. 마이크·과금 없이 흐름만 볼 때.
      # OPENAI_API_KEY  : STT_PROVIDER=openai일 때 필수(기본 운영 경로).
      # ANTHROPIC_API_KEY: 키워드 추출/추천 이유 생성 보조용(선택). 안 넣으면 규칙 기반으로만
      #                   동작한다(요청당 과금 없음) — 비용 정책상 기본은 안 넣는 쪽으로 정함.
      - key: STT_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

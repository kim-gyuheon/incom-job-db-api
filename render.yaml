services:
  - type: web
    name: job-db-api
    runtime: python
    plan: free
    rootDir: api
    # master에 푸시하면 자동 재배포
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    # Render가 주입하는 $PORT로 바인딩해야 한다 (고정 포트 사용 시 배포 실패)
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # 아래 세 개는 값을 저장소에 두지 않고 Render 대시보드에서 직접 입력한다.
      # STT_PROVIDER    : 음성 -> 텍스트 공급자. local(권장, 과금 없음) | openai | mock
      #                   local = faster-whisper를 같은 프로세스에서 직접 실행(비용 정책상
      #                     기본값으로 정함). 2026-08-26에 실측: Systran/faster-whisper 모델의
      #                     ct2 가중치 파일(fp16) 크기가 small=462MB, base=139MB, tiny=73MB —
      #                     int8 로드 시 대략 절반(각각 ~230/~70/~37MB)이지만 Render 무료
      #                     플랜 512MB 안에서 FastAPI/uvicorn/sqlite 기본 오버헤드까지
      #                     더하면 small은 여유가 거의 없어서 기본값을 base로 낮췄다
      #                     (api/stt.py 참고). 그래도 OOM이 나면 tiny로 더 낮추거나 유료
      #                     플랜을 검토할 것.
      #                   openai = OPENAI_API_KEY로 Whisper API 호출(요청당 과금) — local이
      #                     메모리 문제로 안 될 때만 쓰는 대안.
      #                   mock = 고정 문장 반환. 마이크·과금 없이 흐름만 볼 때.
      # OPENAI_API_KEY  : STT_PROVIDER=openai일 때만 필요(기본 경로는 아님)
      # WHISPER_MODEL_SIZE / WHISPER_DEVICE / WHISPER_COMPUTE_TYPE : STT_PROVIDER=local 튜닝용
      #                   (기본 base/cpu/int8 — api/stt.py 참고)
      # ANTHROPIC_API_KEY: 키워드 추출/추천 이유 생성 보조용(선택). 안 넣으면 규칙 기반으로만
      #                   동작한다(요청당 과금 없음) — 비용 정책상 기본은 안 넣는 쪽으로 정함.
      - key: STT_PROVIDER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WHISPER_MODEL_SIZE
        sync: false
      - key: WHISPER_DEVICE
        sync: false
      - key: WHISPER_COMPUTE_TYPE
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
